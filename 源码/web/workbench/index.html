<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NexusHub · 树型工作流 + 实时代码流</title>
    <link rel="stylesheet" href="../common/app.css?v=20261114m" />
    <link rel="stylesheet" href="style.css?v=20261114m" />
  </head>
  <body>
    <header class="appbar" id="appbar" data-tab="workflow" data-crumb="运行详情" data-parent="我的项目">
    <template data-slot="center">
      <span class="pill pill-plain" id="run-stage-pill">等待开始 · 0 / 6 道</span>
    </template>
    <template data-slot="right">
      <button class="btn btn-sm btn-ghost" type="button" id="toggle-tasks">
        <svg viewBox="0 0 24 24" aria-hidden style="width: 15px; height: 15px;"><path d="M4 6h6M4 12h6M4 18h6M14 6h6M14 12h6" /></svg>
        清单
      </button>
      <button class="btn btn-sm btn-ghost" type="button" id="toggle-code">
        <svg viewBox="0 0 24 24" aria-hidden style="width: 15px; height: 15px;"><path d="M4 6h16M4 12h10M4 18h13" /></svg>
        代码
      </button>
      <button class="icon-btn" type="button" aria-label="暂停">
        <svg viewBox="0 0 24 24" aria-hidden><path d="M9 5v14M15 5v14" stroke-width="2" /></svg>
      </button>
    </template>
  </header>

    <div class="work" id="work">
      <!-- ───────── 左上：任务点清单（依次生成） ───────── -->
      <aside class="tasks">
        <div class="tasks-head">
          <h2>任务清单 <span class="pill pill-plain" style="font-weight: 500; font-size: 11px; padding: 1px 8px;">0 项</span></h2>
          <p>主控一边分析一边往下派活</p>
          <div class="stage-progress">
            <div class="label"><span>等待开始</span><span id="pct">0%</span></div>
            <div class="bar"><i id="bar" style="width: 0%"></i></div>
          </div>
        </div>

        <div class="task-list" id="task-list">
          <div class="t-group">
            <button type="button" class="t-item t-master" id="t-master">
              <span class="no">L1</span>
              <span class="name">主控 Agent</span>
              <span class="state">待命</span>
              <span class="chev">▾</span>
            </button>
          </div>

          <!-- 六道：每组可单独收放 -->
          <div class="t-group" id="stage-groups"></div>
        </div>

        <div class="evidence" id="evidence" hidden>
          <div class="evidence-head">参考依据 <span id="evidence-count">0</span></div>
          <div class="evidence-list" id="evidence-list"></div>
        </div>
      </aside>

      <!-- 任务详情：点树上或侧栏的任务卡出现，展示"它干了什么" -->
      <aside class="task-card" id="task-card" hidden>
        <header>
          <span class="tc-stage" id="tc-stage">第 — 道</span>
          <button type="button" class="tc-close" id="tc-close" aria-label="关闭">×</button>
        </header>
        <h4 id="tc-title">任务</h4>
        <dl>
          <div><dt>状态</dt><dd id="tc-state">—</dd></div>
          <div><dt>耗时</dt><dd id="tc-ms">—</dd></div>
          <div><dt>产物</dt><dd id="tc-file">—</dd></div>
        </dl>
        <p class="tc-note" id="tc-note"></p>
        <button type="button" class="btn btn-sm btn-ghost" id="tc-open" hidden>看这个文件</button>
      </aside>

      <!-- ───────── 中：树 ───────── -->
      <main class="canvas" id="canvas">
        <div class="canvas-head">
          <h3>工作流树</h3>
          <span class="hint">一级主控 → 六道工序 → 按需分析出的任务</span>
          <span class="spacer"></span>
          <div class="layout-switch" role="group" aria-label="连线样式">
            <button type="button" data-edges="curve" class="is-on">曲线</button>
            <button type="button" data-edges="elbow">折线</button>
          </div>
          <div class="layout-switch" role="group" aria-label="树的排布">
            <button type="button" data-layout="lr" class="is-on">左右树</button>
            <button type="button" data-layout="td">上下树</button>
          </div>
          <button class="btn btn-sm btn-ghost show-tasks" type="button" id="show-tasks">
            <svg viewBox="0 0 24 24" aria-hidden style="width: 14px; height: 14px;"><path d="M4 6h16M4 12h16M4 18h10" /></svg>
            显示清单
          </button>
          <button class="btn btn-sm btn-ghost show-code" type="button" id="show-code">显示代码</button>
          <div class="speed-pop" id="speed-pop">
            <button type="button" class="speed-btn" id="speed-btn" title="播放速度（1 是真实速度）">1×</button>
            <div class="speed-menu" id="speed-menu">
              <div class="speed-row">
                <span>0.1×</span>
                <input type="range" id="speed" min="0.1" max="1" step="0.1" value="1" />
                <span>1×</span>
              </div>
              <p>只影响呈现，不影响后端与花费</p>
            </div>
          </div>
          <button class="btn btn-sm btn-ghost" type="button" id="replay">
            <svg viewBox="0 0 24 24" aria-hidden style="width: 14px; height: 14px;"><path d="M3 12a9 9 0 1 0 3-6.7" /><path d="M3 4v5h5" /></svg>
            重播生成
          </button>
        </div>

        <div class="focus-bar" id="focus-bar">
          聚焦：<b id="focus-name">—</b>
          <span id="focus-note">其余工序在后台继续</span>
          <button type="button" id="exit-focus">退出聚焦</button>
        </div>

        <div class="canvas-inner" id="canvas-inner">
          <svg class="tree-svg" id="tree-svg" aria-hidden></svg>
          <!-- 节点由脚本插入，便于做逐个出现 -->
        </div>
      </main>

      <!-- ───────── 右：实时代码流（可隐藏 / 可回看） ───────── -->
      <aside class="code-pane" id="code-pane">
        <div class="code-head">
          <div class="tabs">
            <button class="is-on" type="button">代码</button>
            <button type="button">预览</button>
            <button type="button">验收</button>
          </div>
          <span class="spacer"></span>
          <button class="icon-btn" type="button" id="hide-code" aria-label="隐藏代码面板">
            <svg viewBox="0 0 24 24" aria-hidden><path d="M9 6l6 6-6 6" /></svg>
          </button>
        </div>

        <!-- 已生成过的文件：面板只换内容，不消失，随时可以点回去看 -->
        <div class="file-tabs" id="file-tabs" role="tablist" aria-label="已生成的文件"></div>

        <div class="code-file">
          <span class="dot" id="file-dot"></span>
          <span id="file-name">—</span>
          <span class="grow"></span>
          <span class="stream" id="stream-state">等待文件事件<b id="line-count" hidden>0</b></span>
        </div>

        <div class="review-bar" id="review-bar">
          <span id="review-text">回看 · 这个文件已经写完了</span>
          <button type="button" id="replay-file">重播这次生成</button>
          <button type="button" id="back-live">回到实时</button>
        </div>

        <div class="code-body" id="code-body"></div>
      </aside>

      <!-- ───────── 底部：事件条 ───────── -->
      <div class="statusbar">
        <div class="tabs">
          <button class="is-on" type="button">事件</button>
          <button type="button">终端</button>
          <button type="button">验收</button>
        </div>
        <span class="line-text" id="event-line">等待事件…</span>
        <span class="cost">本轮 ¥0.00 · 0 次模型调用</span>
      </div>
    </div>

        
    <script>
  window.onerror = function (msg, src, line) {
    var el = document.getElementById("event-line");
    if (el) el.textContent = "JS错误：" + msg + " @" + line;
    document.title = "ERR " + msg;
  };
</script>
<script src="../common/api.js?v=20261114m"></script>
<script src="../common/appbar.js?v=20261114m"></script>
<script src="main.js?v=20261114m"></script>
    <script src="./live.js?v=20261114m"></script>
  
  <!-- 门禁：AI 拿不准时停下来问，任何阶段都可能出现 -->
  <div class="gate-modal" id="gate-modal" hidden>
    <div class="gate-card">
      <h4 class="gate-title">需要你确认</h4>
      <div class="gate-body"></div>
      <div class="gate-actions">
        <button type="button" class="btn btn-sm btn-ghost" id="gate-skip">按默认继续</button>
        <button type="button" class="btn btn-sm btn-primary" id="gate-submit">提交</button>
      </div>
    </div>
  </div>
</body>
</html>
