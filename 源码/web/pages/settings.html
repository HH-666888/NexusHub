<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NexusHub · 设置</title>
    <link rel="stylesheet" href="../system/app.css" />
    <link rel="stylesheet" href="../system/glass.css" />
    <style>
      .settings-shell { display: flex; min-height: calc(100vh - 60px); }

      .settings-side {
        width: 240px;
        flex: none;
        border-right: 1px solid var(--line);
        padding: 18px 12px;
        background: var(--card);
      }
      .settings-side a {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        border-radius: 10px;
        text-decoration: none;
        color: var(--text-2);
        font-size: 13.5px;
      }
      .settings-side a svg { width: 17px; height: 17px; }
      .settings-side a:hover { background: var(--card-2); color: var(--text); }
      .settings-side a.is-here { background: var(--primary-soft); color: var(--primary); font-weight: 600; }

      .settings-main { flex: 1; min-width: 0; padding: 30px 40px 40px; }
      .settings-main h1 { margin: 0 0 6px; font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
      .settings-main > p { margin: 0 0 22px; font-size: 13.5px; color: var(--text-2); }

      .section { padding: 22px 24px; margin-bottom: 18px; }
      .section > h2 { margin: 0 0 6px; font-size: 15.5px; font-weight: 700; }
      .section > .desc { margin: 0 0 18px; font-size: 12.5px; color: var(--text-3); }
      .section hr { border: none; border-top: 1px solid var(--line); margin: 18px 0; }

      .provider-grid { display: flex; gap: 10px; flex-wrap: wrap; }
      .provider {
        display: flex; align-items: center; gap: 10px;
        padding: 12px 16px;
        border-radius: 11px;
        border: 1px solid var(--line-2);
        background: var(--card);
        font-size: 13.5px;
        color: var(--text-2);
        cursor: pointer;
      }
      .provider svg { width: 18px; height: 18px; }
      .provider:hover { border-color: var(--primary-line); }
      .provider.is-on { border-color: var(--primary); background: var(--primary-soft); color: var(--primary); font-weight: 600; }

      .budget-input {
        display: flex; align-items: center; gap: 10px;
        width: 140px; height: 42px; padding: 0 12px;
        border-radius: 10px; border: 1px solid var(--line-2); background: var(--card-2);
        font-size: 14px;
      }
      .budget-input span { color: var(--text-3); }

      .theme-grid { display: flex; gap: 14px; }
      .swatch-preview {
        width: 100%; height: 100%; border-radius: 10px;
        display: grid; place-items: center;
        font-size: 11.5px; color: var(--text-3);
      }
      .swatch-preview.light { background: #f6f8fc; }
      .swatch-preview.dark { background: #12161e; color: #6f7a8c; }

      .save-bar {
        position: sticky; bottom: 0;
        display: flex; align-items: center; justify-content: space-between; gap: 16px;
        margin-top: 8px; padding: 14px 24px;
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: var(--r-md);
        box-shadow: var(--shadow-card);
      }
      .save-bar span { font-size: 12.5px; color: var(--text-3); }

      @media (max-width: 900px) {
        .settings-side { display: none; }
        .settings-main { padding: 22px 18px 30px; }
        .field-row { grid-template-columns: minmax(0, 1fr); }
      }
    </style>
  </head>
  <body>
    <header class="appbar">
      <a class="brand" href="./welcome.html">
        <svg viewBox="0 0 24 24" aria-hidden><path class="brand-mark" d="M4 20V4h3.4l9.2 12V4H20v16h-3.4L7.4 8v12H4z" /></svg>
        NexusHub
      </a>
      <nav class="crumb"><span>/</span><b>设置</b></nav>
      <div class="appbar-right">
        <a class="btn btn-sm btn-ghost" href="./projects.html">返回项目</a>
        <button class="icon-btn" type="button" id="theme-toggle" aria-label="切换主题">
          <svg viewBox="0 0 24 24" aria-hidden><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" /></svg>
        </button>
        <button class="avatar" type="button" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); color: var(--text-2); font: inherit; font-size: 13px; cursor: pointer;">demo</button>
      </div>
    </header>

    <div class="settings-shell">
      <nav class="settings-side" aria-label="设置分区">
        <a class="is-here" href="#s-model">
          <svg viewBox="0 0 24 24" aria-hidden><rect x="4" y="4" width="16" height="7" rx="2" /><rect x="4" y="14" width="16" height="6" rx="2" /></svg>
          模型配置
        </a>
        <a href="#s-budget">
          <svg viewBox="0 0 24 24" aria-hidden><rect x="4" y="5" width="16" height="14" rx="3" /><path d="M8 10h8M8 14h5" /></svg>
          成本预算
        </a>
        <a href="#s-theme">
          <svg viewBox="0 0 24 24" aria-hidden><circle cx="12" cy="12" r="4" /><path d="M12 3v2M12 19v2M3 12h2M19 12h2" /></svg>
          外观主题
        </a>
        
        
      </nav>

      <main class="settings-main">
        <h1>设置</h1>
        <p>这里改的东西只影响你这台机器上的运行，不会同步到别人的账号。</p>

        <section class="panel section" id="s-model">
          <h2>模型提供商</h2>
          <p class="desc">决定工厂用谁的大脑。换提供商不影响已经生成过的项目。</p>

          <div class="provider-grid">
            <div class="provider is-on">
              <svg viewBox="0 0 24 24" aria-hidden><path d="M4 16c4-8 12-8 16 0" /><circle cx="12" cy="16" r="1.6" /></svg>
              DeepSeek
            </div>
            <div class="provider">
              <svg viewBox="0 0 24 24" aria-hidden><circle cx="12" cy="12" r="8" /><path d="M8 12h8" /></svg>
              OpenAI 兼容
            </div>
            <div class="provider">
              <svg viewBox="0 0 24 24" aria-hidden><rect x="3" y="5" width="18" height="12" rx="2" /><path d="M8 21h8M12 17v4" /></svg>
              本地模型
            </div>
          </div>

          <div class="field-row">
            <label>API Key</label>
            <div>
              <div style="display: flex; gap: 8px;">
                <input class="input" type="password" value="sk-demo-0000000000000000" />
                <button class="btn btn-ghost" type="button">测试连接</button>
              </div>
              <p class="hintline">存在本机 `.env`，不会上传。留空则用环境变量里的 Key。</p>
            </div>
          </div>

          <div class="field-row">
            <label>决策模型</label>
            <select class="select">
              <option>deepseek-chat（快、便宜，适合拆需求与定架构）</option>
              <option>deepseek-reasoner（慢、贵，适合复杂需求）</option>
            </select>
          </div>

          <div class="field-row">
            <label>执行模型</label>
            <select class="select">
              <option>deepseek-chat（默认，写代码够用）</option>
              <option>deepseek-reasoner（复杂页面更稳）</option>
            </select>
          </div>
        </section>

        <section class="panel section" id="s-budget">
          <h2>成本预算</h2>
          <p class="desc">两道闸门：单次任务到顶就停，每日总额到顶当天不再接新任务。</p>

          <div class="field-row">
            <label>单次任务上限</label>
            <div style="display: flex; align-items: center; gap: 20px;">
              <div class="budget-input"><span>¥</span>2.00</div>
              <input class="slider" type="range" min="0" max="10" value="2" step="0.5" aria-label="单次任务上限" style="background: linear-gradient(to right, var(--primary) 0 20%, var(--card-3) 20% 100%);" />
            </div>
          </div>

          <div class="field-row">
            <label>每日总预算</label>
            <div style="display: flex; align-items: center; gap: 20px;">
              <div class="budget-input"><span>¥</span>20.00</div>
              <input class="slider" type="range" min="0" max="100" value="20" step="5" aria-label="每日总预算" style="background: linear-gradient(to right, var(--primary) 0 20%, var(--card-3) 20% 100%);" />
            </div>
          </div>
        </section>

        <section class="panel section" id="s-theme">
          <h2>外观主题</h2>
          <p class="desc">浅色适合白天与投屏，深色适合夜里盯着看。</p>

          <div class="theme-grid">
            <div class="swatch-card is-on">
              <div class="swatch is-on"><div class="swatch-preview light">浅色预览</div></div>
              浅色
            </div>
            <div class="swatch-card">
              <div class="swatch"><div class="swatch-preview dark">深色预览</div></div>
              深色
            </div>
          </div>
        </section>

        <div class="save-bar">
          <span>上次保存：今天 08:02</span>
          <div style="display: flex; gap: 10px;">
            <button class="btn btn-ghost" type="button">恢复默认</button>
            <button class="btn btn-primary" type="button">保存更改</button>
          </div>
        </div>
      </main>
    </div>

    <script>
      // file:// 下有些浏览器禁用 localStorage：读写都兜底，别把整段脚本带崩
      function safeTheme() {
        try { return localStorage.getItem("nexus-theme"); } catch (e) { return null; }
      }
      function saveTheme(value) {
        try { localStorage.setItem("nexus-theme", value); } catch (e) { /* 忽略 */ }
      }
      (function () {
        const param = new URLSearchParams(location.search).get("theme");
        document.documentElement.dataset.theme = param || safeTheme() || "light";
        document.documentElement.dataset.style = new URLSearchParams(location.search).get("style") || "";
        document.addEventListener("click", function (event) {
          if (!event.target.closest("#theme-toggle")) return;
          const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
          document.documentElement.dataset.theme = next;
          saveTheme(next);
        });
      })();
    </script>
    <script src="../system/api.js"></script>
    <script>
      // 真数据：设置读写 /api/v1/settings（读回主题与预算，改动即存）
      (async function () {
        if (!window.api) return;
        const saved = await window.api.settings();
        if (!saved || typeof saved !== "object") return;

        if (saved.theme === "dark" || saved.theme === "light") {
          if (!safeTheme || !safeTheme()) {
            document.documentElement.dataset.theme = saved.theme;
            try { localStorage.setItem("nexus-theme", saved.theme); } catch (e) {}
          }
        }

        const budget = Array.from(document.querySelectorAll("input.slider"))
          .find((el) => (el.getAttribute("aria-label") || "").includes("单次"));
        if (budget && typeof saved.budgetPerRun === "number") budget.value = String(saved.budgetPerRun);

        if (budget) {
          let timer = null;
          budget.addEventListener("input", function () {
            clearTimeout(timer);
            timer = setTimeout(function () {
              window.api.saveSettings({ budgetPerRun: Number(budget.value) });
            }, 400);
          });
        }

        const toggle = document.getElementById("theme-toggle");
        if (toggle) {
          toggle.addEventListener("click", function () {
            setTimeout(function () {
              window.api.saveSettings({ theme: document.documentElement.dataset.theme });
            }, 60);
          });
        }
      })();
    </script>
  </body>
</html>
