<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>辅助开发 · NexusHub</title>
  <link rel="stylesheet" href="../common/app.css?v=20261113h">
  <link rel="stylesheet" href="./style.css?v=20261113h">
</head>
<body>
  <header class="appbar" id="appbar" data-crumb="辅助开发"></header>

  <main class="assist-page">
    <div class="assist-new">
      <svg viewBox="0 0 24 24" aria-hidden style="width: 18px; height: 18px; color: var(--text-3); flex: none; align-self: center;"><path d="M12 5v14M5 12h14" /></svg>
      <input id="goal" type="text" placeholder="描述你要做的软件，例如：一个团队任务看板（AI 会陪你一步步做）" aria-label="辅助开发目标">
      <button class="btn btn-primary" type="button" id="create">创建辅助项目</button>
    </div>

    <div class="head" style="display: flex; align-items: center; gap: 10px; margin: 0 0 16px;">
      <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em;">辅助项目 <span id="count" class="count">0</span></h1>
    </div>

    <section class="assist-grid" id="list">
      <div class="assist-empty">
        还没有辅助项目。<br />
        在上面写一句你要做的软件，创建后按六道工序一步一步做。
      </div>
    </section>
  </main>

  <script src="../common/api.js?v=20261113h"></script>
  <script src="../common/appbar.js?v=20261113h"></script>
  <script src="./main.js?v=20261113h"></script>
</body>
</html>
