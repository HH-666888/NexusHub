<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NexusHub</title>
    <link rel="stylesheet" href="./common/app.css?v=20261113i" />
    <style>
      /* 兜底画面：只在脚本没跑起来时出现 */
      body { display: grid; place-items: center; min-height: 100vh; margin: 0; }
      .fallback { text-align: center; color: var(--text-2); font-size: 14px; }
      .fallback a { color: var(--primary); }
    </style>
  </head>
  <body>
    <p class="fallback">正在进入… 如果没有反应，<a href="./welcome/">点这里</a>。</p>

    <script src="./common/api.js?v=20261113i"></script>
    <script>
      // 入口分流：登录了直接开工，没登录先看欢迎页
      (async function () {
        let target = "./welcome/";
        try {
          const user = window.api ? await window.api.me() : null;
          if (user) target = "./projects/";
        } catch (error) {
          /* 取不到就按未登录处理 */
        }
        location.replace(target);
      })();
    </script>
  </body>
</html>
