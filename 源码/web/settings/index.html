<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NexusHub · 设置</title>
    <link rel="stylesheet" href="../common/app.css?v=20261114r" />
    <link rel="stylesheet" href="../common/glass.css?v=20261114r" />
    <link rel="stylesheet" href="style.css?v=20261114r" />
  </head>
  <body>
    <header class="appbar" id="appbar" data-tab="" data-crumb="设置"></header>

    <div class="settings-shell">
      <nav class="settings-side" aria-label="设置分区">
        <a class="is-here" href="#s-model">
          <svg viewBox="0 0 24 24" aria-hidden><rect x="4" y="4" width="16" height="7" rx="2" /><rect x="4" y="14" width="16" height="6" rx="2" /></svg>
          模型接入
        </a>
        <a href="#s-theme">
          <svg viewBox="0 0 24 24" aria-hidden><circle cx="12" cy="12" r="4" /><path d="M12 3v2M12 19v2M3 12h2M19 12h2" /></svg>
          外观主题
        </a>
        <a href="#s-memory">
          <svg viewBox="0 0 24 24" aria-hidden><path d="M12 3a7 7 0 0 0-7 7c0 3 2 4 2 6h10c0-2 2-3 2-6a7 7 0 0 0-7-7z" /><path d="M9 20h6" /></svg>
          AI 记忆
        </a>
      </nav>

      <main class="settings-main">
        <h1>设置</h1>
        <p>这里改的东西只影响你这台机器上的运行，不会同步到别人的账号。</p>

        <section class="panel section" id="s-model">
          <h2>模型接入</h2>
          <p class="desc">固定使用 DeepSeek。只需填自己的 API Key；不填则用服务端环境变量里的 Key。</p>

          <div class="field-row">
            <label>API Key</label>
            <div>
              <div style="display: flex; gap: 8px;">
                <input class="input" type="password" value="" placeholder="sk-…（不会回显已保存的 key）" />
                <button class="btn btn-ghost" type="button">测试连接</button>
              </div>
              <p class="hintline">保存后不回显；留空表示不修改。填了会用于之后的工作流和辅助开发。</p>
            </div>
          </div>
        </section>

        <section class="panel section" id="s-theme">
          <h2>外观主题</h2>
          <p class="desc">浅色适合白天与投屏，深色适合夜里盯着看。</p>

          <div class="theme-grid">
            <div class="swatch-card is-on">
              <div class="swatch is-on"><div class="swatch-preview light">浅色预览</div></div>
              浅色
            </div>
            <div class="swatch-card">
              <div class="swatch"><div class="swatch-preview dark">深色预览</div></div>
              深色
            </div>
          </div>
        </section>

        <section class="panel section" id="s-memory">
          <h2>AI 记忆</h2>
          <p style="margin:0 0 10px;font-size:12.5px;color:var(--text-3);">记忆只在“辅助开发”里生效；工作流使用模型的纯粹能力，不读取记忆。</p>
          <div id="memory-summary" style="font-size:13px;color:var(--text-2);">正在读取…</div>
          <div style="margin-top:12px;"><a class="btn btn-sm btn-ghost" href="../memory/">打开记忆页</a></div>
        </section>

        <div class="save-bar">
          <span>尚未保存</span>
          <div style="display: flex; gap: 10px;">
            <button class="btn btn-primary" type="button">保存 API Key</button>
          </div>
        </div>
      </main>
    </div>

    <script src="../common/api.js?v=20261114r"></script>
    <script src="../common/appbar.js?v=20261114r"></script>
    <script src="main.js?v=20261114r"></script>
    <script>
      (async function () {
        var box = document.getElementById("memory-summary");
        if (!box || !window.api || !window.api.memoryStats) return;
        var stats = await window.api.memoryStats();
        if (!stats) { box.textContent = "暂时读不到记忆统计。"; return; }
        box.innerHTML =
          "共 <b>" + stats.total + "</b> 条 · 今日 <b>" + stats.today + "/" + stats.dailyLimit +
          "</b> · 近 7 天 <b>" + stats.week + "</b> 条";
      })();
    </script>
  </body>
</html>
