[project]
name = "nexus-backend"
version = "0.1.0"
description = "Nexus 后端：运行状态机、六道工序流水线、RAG 与成本台账"
requires-python = ">=3.12"

dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "pymysql>=1.1",
  "alembic>=1.13",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "python-multipart>=0.0.12",
  "httpx>=0.27",
  "numpy>=2.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "import-linter>=2.1",
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI 的 Depends() 就是要写在默认参数里

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# 单元测试不碰数据库，集成测试跑在 nexus_test 库上；两组分开跑（见 README）
markers = ["integration: 需要真实 MySQL 的用例"]

[tool.importlinter]
root_packages = ["app"]

[[tool.importlinter.contracts]]
name = "domain 不依赖任何东西"
type = "forbidden"
source_modules = ["app.domain"]
forbidden_modules = ["app.features", "app.pipeline", "app.ai", "app.db", "app.shared"]

[[tool.importlinter.contracts]]
name = "ai 不依赖上层"
type = "forbidden"
source_modules = ["app.ai"]
forbidden_modules = ["app.pipeline", "app.features"]

[[tool.importlinter.contracts]]
name = "pipeline 不依赖 HTTP 层"
type = "forbidden"
source_modules = ["app.pipeline"]
forbidden_modules = ["app.features"]