          ¥5.87 / ¥20

      </div>
    </header>

    <main class="page">
      <div class="new-bar">
        <svg viewBox="0 0 24 24" aria-hidden style="width: 18px; height: 18px; color: var(--text-3); flex: none;"><path d="M12 5v14M5 12h14" /></svg>
        <input type="text" placeholder="用一句话描述你要做的软件，例如：一个能拖拽的团队任务看板" aria-label="新需求" />
        <button class="btn btn-primary" type="button">生成</button>
      </div>

      <div class="head">
        <h1>我的项目 <span class="count">26</span></h1>
        <div class="seg" role="tablist">
          <button class="is-on" type="button">全部</button>
          <button type="button">进行中 2</button>
          <button type="button">已完成 21</button>
          <button type="button">未通过 3</button>
        </div>
      </div>

      <div class="grid">
        <a class="card-new" href="../workbench/?run=new">
          <span class="plus"><svg viewBox="0 0 24 24" aria-hidden><path d="M12 5v14M5 12h14" /></svg></span>
          <b>新建项目</b>
          <small>从一句话开始</small>
        </a>
      </div>

      <footer class="foot">
        <span>NexusHub 0.9.4</span>
        <span id="foot-count">共 0 个项目 · 今日花费 ¥0.00</span>
        <span id="foot-budget">剩余预算 ¥0.00</span>
