<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NexusHub · 设置</title>
    <link rel="stylesheet" href="../common/app.css?v=20261108b" />
    <link rel="stylesheet" href="../common/glass.css?v=20261108b" />
    <link rel="stylesheet" href="style.css?v=20261108b" />
  </head>
  <body>
    <header class="appbar">
      <a class="brand" href="../welcome/">
        <svg viewBox="0 0 24 24" aria-hidden><path class="brand-mark" d="M4 20V4h3.4l9.2 12V4H20v16h-3.4L7.4 8v12H4z" /></svg>
        NexusHub
      </a>
      <nav class="crumb"><span>/</span><b>设置</b></nav>
      <div class="appbar-right">
        <a class="btn btn-sm btn-ghost" href="../projects/">返回项目</a>
        <button class="icon-btn" type="button" id="theme-toggle" aria-label="切换主题">
          <svg viewBox="0 0 24 24" aria-hidden><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M19.1 4.9l-1.4 1.4M6.3 17.7l-1.4 1.4" /></svg>
        </button>
        <button class="avatar" type="button" style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line-2); background: var(--card); color: var(--text-2); font: inherit; font-size: 13px; cursor: pointer;">demo</button>
      </div>
    </header>

    <div class="settings-shell">
      <nav class="settings-side" aria-label="设置分区">
        <a class="is-here" href="#s-model">
          <svg viewBox="0 0 24 24" aria-hidden><rect x="4" y="4" width="16" height="7" rx="2" /><rect x="4" y="14" width="16" height="6" rx="2" /></svg>
          模型配置
        </a>
        <a href="#s-budget">
          <svg viewBox="0 0 24 24" aria-hidden><rect x="4" y="5" width="16" height="14" rx="3" /><path d="M8 10h8M8 14h5" /></svg>
          成本预算
        </a>
        <a href="#s-theme">
          <svg viewBox="0 0 24 24" aria-hidden><circle cx="12" cy="12" r="4" /><path d="M12 3v2M12 19v2M3 12h2M19 12h2" /></svg>
          外观主题
        </a>
        
        
      </nav>

      <main class="settings-main">
        <h1>设置</h1>
        <p>这里改的东西只影响你这台机器上的运行，不会同步到别人的账号。</p>

        <section class="panel section" id="s-model">
          <h2>模型提供商</h2>
          <p class="desc">决定工厂用谁的大脑。换提供商不影响已经生成过的项目。</p>

          <div class="provider-grid">
            <div class="provider is-on">
              <svg viewBox="0 0 24 24" aria-hidden><path d="M4 16c4-8 12-8 16 0" /><circle cx="12" cy="16" r="1.6" /></svg>
              DeepSeek
            </div>
            <div class="provider">
              <svg viewBox="0 0 24 24" aria-hidden><circle cx="12" cy="12" r="8" /><path d="M8 12h8" /></svg>
              OpenAI 兼容
            </div>
            <div class="provider">
              <svg viewBox="0 0 24 24" aria-hidden><rect x="3" y="5" width="18" height="12" rx="2" /><path d="M8 21h8M12 17v4" /></svg>
              本地模型
            </div>
          </div>

          <div class="field-row">
            <label>API Key</label>
            <div>
              <div style="display: flex; gap: 8px;">
                <input class="input" type="password" value="sk-demo-0000000000000000" />
                <button class="btn btn-ghost" type="button">测试连接</button>
              </div>
              <p class="hintline">保存后不回显；留空表示不修改。留空时用环境变量里的 Key。</p>
            </div>
          </div>

          <div class="field-row">
            <label>决策模型</label>
            <select class="select">
              <option value="deepseek-chat">deepseek-chat（快、便宜，适合拆需求与定架构）</option>
              <option value="deepseek-reasoner">deepseek-reasoner（慢、贵，适合复杂需求）</option>
            </select>
          </div>

          <div class="field-row">
            <label>执行模型</label>
            <select class="select">
              <option value="deepseek-chat">deepseek-chat（默认，写代码够用）</option>
              <option value="deepseek-reasoner">deepseek-reasoner（复杂页面更稳）</option>
            </select>
          </div>
        </section>

        <section class="panel section" id="s-budget">
          <h2>成本预算</h2>
          <p class="desc">两道闸门：单次任务到顶就停，每日总额到顶当天不再接新任务。</p>

          <div class="field-row">
            <label>单次任务上限</label>
            <div style="display: flex; align-items: center; gap: 20px;">
              <div class="budget-input"><span>¥</span>2.00</div>
              <input class="slider" type="range" min="0" max="10" value="2" step="0.5" aria-label="单次任务上限" style="background: linear-gradient(to right, var(--primary) 0 20%, var(--card-3) 20% 100%);" />
            </div>
          </div>

          <div class="field-row">
            <label>每日总预算</label>
            <div style="display: flex; align-items: center; gap: 20px;">
              <div class="budget-input"><span>¥</span>20.00</div>
              <input class="slider" type="range" min="0" max="100" value="20" step="5" aria-label="每日总预算" style="background: linear-gradient(to right, var(--primary) 0 20%, var(--card-3) 20% 100%);" />
            </div>
          </div>
        </section>

        <section class="panel section" id="s-theme">
          <h2>外观主题</h2>
          <p class="desc">浅色适合白天与投屏，深色适合夜里盯着看。</p>

          <div class="theme-grid">
            <div class="swatch-card is-on">
              <div class="swatch is-on"><div class="swatch-preview light">浅色预览</div></div>
              浅色
            </div>
            <div class="swatch-card">
              <div class="swatch"><div class="swatch-preview dark">深色预览</div></div>
              深色
            </div>
          </div>
        </section>

        <div class="save-bar">
          <span>上次保存：今天 08:02</span>
          <div style="display: flex; gap: 10px;">
            <button class="btn btn-ghost" type="button">恢复默认</button>
            <button class="btn btn-primary" type="button">保存更改</button>
          </div>
        </div>
      </main>
    </div>

        <script src="../common/api.js?v=20261108b"></script>
    <script src="../common/demo.js?v=20261108b"></script>
        <script src="main.js?v=20261108b"></script>
  </body>
</html>
