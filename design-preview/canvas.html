<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>画布参考稿 · 可操作</title>
<!--
  ════════════════════════════════════════════════════════════
  画布参考稿 —— 这个文件是**能真的操作**的
  ════════════════════════════════════════════════════════════
  · 拖空白处      → 平移
  · 滚轮          → 缩放（以光标为中心）
  · 点节点        → 右侧看详情
  · 右下角按钮    → 缩放 / 适应窗口 / 回到原点

  用纯 JS 写，没有依赖 —— 目的只是让你**摸到手感**，
  不是最终实现。实际项目里会换成 React Flow。

  ── 画布上放的东西，全部是真的 ──
    · 六个阶段节点（4 个未接入，灰显）
    · 回退边（虚线）—— 这来自我们 stages.ts 里真实的 fallbackTo 声明
    · 产物 / 自检 / 成本 三类子节点
    · 顶部输入节点

  ── 性能纪律 ──
    平移缩放只改一个 transform，不重排任何节点。
    这条和项目里「只动 transform / opacity」的规矩一致。
  ════════════════════════════════════════════════════════════
-->
<style>
:root{
  --ink-1:#f1f5f9; --ink-2:#e2e8f0; --ink-3:#cbd5e1; --ink-4:#94a3b8;
  --ink-5:#64748b; --ink-6:#475569; --ink-7:#334155;
  --canvas:#08090c; --surface:#101114; --surface-2:#16181d; --line:#2a2f3a;
  --accent:#2563eb; --accent-soft:#60a5fa; --accent-glow:37,99,235;
  --t1:34,211,238; --t2:59,130,246; --t3:139,92,246;
  --t4:236,72,153; --t5:217,70,239; --t6:16,185,129;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--canvas);color:var(--ink-2);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei","Segoe UI",sans-serif;
  -webkit-font-smoothing:antialiased}

/* ── 顶栏 ── */
.top{position:fixed;inset:0 0 auto 0;height:58px;z-index:20;display:flex;align-items:center;gap:16px;
  padding:0 20px;border-bottom:1px solid var(--line);background:rgba(8,9,12,.86);
  backdrop-filter:blur(8px)}
.brand i{width:8px;height:8px;border-radius:99px;background:var(--accent);display:inline-block}
.brand b{font-size:16px;font-weight:600;margin-left:8px}
.brand u{display:block;font-size:11px;color:var(--ink-4);text-decoration:none;margin-top:1px}
.inp{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:9px;
  padding:9px 14px;font-size:13px;color:var(--ink-4);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.actions{display:flex;align-items:center;gap:8px;border-left:1px solid var(--line);padding-left:14px}
.btn{padding:9px 18px;border-radius:9px;background:var(--accent);color:#fff;font-size:13px;font-weight:500}
.sm{padding:5px 10px;border:1px solid var(--line);border-radius:8px;font-size:11px;color:var(--ink-4)}
.who{text-align:right;line-height:1.2}
.who b{display:block;font-size:13px;font-weight:500}
.who span{font-size:10.5px;color:var(--ink-5)}

/* ══ 画布 ══ */
.viewport{position:fixed;inset:58px 300px 0 0;overflow:hidden;cursor:grab;
  background:
    radial-gradient(1100px 620px at 42% 8%, rgba(var(--accent-glow),.09), transparent 62%),
    var(--canvas)}
.viewport.grabbing{cursor:grabbing}
/* 点阵底纹：跟着画布一起平移缩放，所以它要放在世界层里 */
.world{position:absolute;top:0;left:0;transform-origin:0 0;will-change:transform}
.dots{position:absolute;left:-3000px;top:-3000px;width:8000px;height:8000px;
  background-image:radial-gradient(circle, rgba(148,163,184,.13) 1px, transparent 1px);
  background-size:26px 26px;pointer-events:none}
svg.edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
svg.edges path{fill:none;stroke-width:1.4}
/* 主流程线要看得见。原来用 --line(#2a2f3a) 在 #08090c 上几乎不可见 ——
   连线的可读性直接决定「这是一张图」还是「一堆散落的卡片」 */
svg.edges path.solid{stroke:rgba(148,163,184,.42)}
svg.edges path.live{stroke:rgb(var(--t4) / .8);stroke-width:1.6}
svg.edges path.back{stroke:rgba(217,119,6,.62);stroke-dasharray:5 5}
svg.edges text{fill:var(--ink-5);font-size:9px;font-family:ui-monospace,monospace}

/* ── 节点 ── */
.node{position:absolute;border-radius:11px;border:1px solid;background-color:var(--surface);
  padding:10px 13px;cursor:pointer;user-select:none;
  border-color:rgb(var(--t) / .42);
  background-image:linear-gradient(140deg,rgb(var(--t) / .15) 0%,rgb(var(--t) / .035) 52%,transparent 100%);
  box-shadow:0 0 20px -12px rgb(var(--t) / .85);
  transition:box-shadow .16s ease-out, transform .16s ease-out}
.node:hover{box-shadow:0 0 0 1px rgb(var(--t) / .55), 0 0 26px -8px rgb(var(--t) / .9)}
.node.sel{box-shadow:0 0 0 2px rgb(var(--t) / .85), 0 0 30px -6px rgb(var(--t) / .95)}
.node.dim{opacity:.42;background-image:none;box-shadow:none}
.node .no{display:flex;align-items:center;gap:6px;font-family:ui-monospace,monospace;
  font-size:10px;font-weight:600;color:rgb(var(--t))}
.node .no i{width:5px;height:5px;border-radius:99px;background:rgb(var(--t));display:block;
  box-shadow:0 0 9px 1px rgb(var(--t) / .65)}
.node .nm{font-size:13px;font-weight:500;margin-top:4px;color:var(--ink-1)}
.node .ar{font-family:ui-monospace,monospace;font-size:9.5px;color:var(--ink-5);margin-top:2px}
.node .pill{position:absolute;top:9px;right:10px;font-size:9px;border-radius:5px;padding:1px 6px;
  border:1px solid rgb(var(--t) / .55);color:rgb(var(--t));background:rgb(var(--t) / .13)}
.node.dim .pill{border-color:var(--ink-7);color:var(--ink-5);background:none}
.node.run{box-shadow:0 0 0 1px rgb(var(--t) / .8), 0 0 34px -6px rgb(var(--t) / .9)}
.node.run::after{content:"";position:absolute;inset:-1px;border-radius:inherit;
  border:1px solid rgb(var(--t) / .9);animation:halo 1.9s ease-out infinite;pointer-events:none}
@keyframes halo{0%{opacity:.85;transform:scale(1)}70%{opacity:0;transform:scale(1.035)}100%{opacity:0;transform:scale(1.035)}}

/* 小节点（产物 / 自检 / 成本 / 输入） */
.node.mini{padding:8px 11px;border-radius:9px}
.node.mini .nm{font-size:11.5px;margin-top:0}
.node.mini .sub{font-size:9.5px;color:var(--ink-5);margin-top:2px;font-variant-numeric:tabular-nums}
.node.mini .big{font-size:15px;font-weight:600;color:var(--ink-1);margin-top:2px;
  font-variant-numeric:tabular-nums}
.node.input{background-image:linear-gradient(140deg,rgb(var(--accent-glow) / .22),transparent 60%);
  border-color:rgb(var(--accent-glow) / .55);max-width:260px}
.node.input .tx{font-size:11.5px;line-height:1.55;color:var(--ink-3)}

/* ── 悬浮控制条 ── */
.hud{position:fixed;right:320px;bottom:18px;z-index:20;display:flex;align-items:center;gap:6px;
  background:rgba(16,17,20,.9);border:1px solid var(--line);border-radius:11px;padding:6px;
  backdrop-filter:blur(8px)}
.hud button{background:none;border:0;color:var(--ink-4);font-size:12px;padding:6px 11px;
  border-radius:7px;cursor:pointer;font-family:inherit}
.hud button:hover{background:rgba(51,65,85,.55);color:var(--ink-1)}
.hud .zl{font-size:11px;color:var(--ink-5);padding:0 8px;font-variant-numeric:tabular-nums;
  min-width:46px;text-align:center}
.hud .sep{width:1px;height:18px;background:var(--line)}

/* ── 右侧详情 ── */
.panel{position:fixed;top:58px;right:0;bottom:0;width:300px;border-left:1px solid var(--line);
  background:rgba(16,17,20,.6);padding:16px 14px;overflow-y:auto;z-index:15}
.panel h4{font-size:11.5px;color:var(--ink-4);font-weight:500;margin-bottom:12px}
.card{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:12px;margin-bottom:9px}
.card .k{font-size:11px;color:var(--ink-5)}
.card .v{font-size:15px;font-weight:600;color:var(--ink-1);margin-top:4px;line-height:1.5}
.card p{font-size:11px;line-height:1.75;color:var(--ink-4);margin-top:5px}
.card ul{list-style:none;margin-top:6px}
.card li{font-size:10.5px;line-height:1.8;color:var(--ink-5)}
.card li.ok{color:rgb(var(--t6))}
.card li.ok::before{content:"✓ "}
.card li::before{content:"· "}
.muted{font-size:10.5px;line-height:1.75;color:var(--ink-6);padding:0 2px}
kbd{font-family:ui-monospace,monospace;font-size:10px;border:1px solid var(--line);
  border-radius:4px;padding:1px 5px;color:var(--ink-4)}
</style>
</head>
<body>

<div class="top">
  <div class="brand"><i></i><b>Nexus</b><u>一个网页里的软件工厂</u></div>
  <div class="inp">做一个团队任务看板，能拖拽卡片、能标记完成、刷新后数据还在</div>
  <div class="actions">
    <span class="btn">开始构建</span><span class="sm">☾ 黑</span><span class="sm">设置</span>
    <div class="who"><b>demo</b><span>@demo</span></div><span class="sm">退出</span>
  </div>
</div>

<div class="viewport" id="vp">
  <div class="world" id="world">
    <div class="dots"></div>
    <svg class="edges" id="edges"></svg>
  </div>
</div>

<div class="hud">
  <button id="zo">−</button><span class="zl" id="zl">100%</span><button id="zi">+</button>
  <span class="sep"></span>
  <button id="zfit">适应窗口</button>
  <button id="zreset">回到原点</button>
</div>

<div class="panel">
  <h4 id="ptitle">产物与详情</h4>
  <div id="pbody">
    <div class="card">
      <div class="k">画布操作</div>
      <p style="margin-top:8px">
        拖空白处 · 平移<br>
        滚轮 · 缩放<br>
        点节点 · 看详情
      </p>
      <p style="margin-top:8px;color:var(--ink-5)">
        <kbd>0</kbd> 适应窗口 &nbsp; <kbd>1</kbd> 回到原点
      </p>
    </div>
    <div class="card">
      <div class="k">这次运行</div>
      <div class="v">¥0.0256</div>
      <p>8.2 秒 · 1 次模型调用 · 输出 6 345 token</p>
    </div>
    <p class="muted">
      点左边画布上的任意节点，这里会显示它的详情。
      灰显的是尚未接入的工序。
    </p>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════════════════
   数据：节点与连边
   ------------------------------------------------------------
   节点的 kind 决定它长什么样；data 是点开之后显示的内容。
   真实项目里这些数据来自数据库，这里写死是为了做参考稿。
   ════════════════════════════════════════════════════════════ */
const T = ['--t1','--t2','--t3','--t4','--t5','--t6'];

const NODES = [
  { id:'in',  kind:'input', x:0,   y:150, w:250, h:76,
    title:'输入', tx:'做一个团队任务看板，能拖拽卡片、能标记完成、刷新后数据还在',
    detail:{ k:'你输入的一句话', v:'做一个团队任务看板……', p:'整条流水线的起点。' } },

  /* 前三道：纵向排开，间距收紧到 84 —— 原来 100 太散，
     连线被拉得太长，读起来不像一组 */
  { id:'s1', kind:'stage', x:320, y:66,  w:146, h:70, t:0, no:'01', nm:'规格化',   ar:'spec.json',   dim:true },

  { id:'s2', kind:'stage', x:320, y:150, w:146, h:70, t:1, no:'02', nm:'架构定型', ar:'arch.json',   dim:true },

  { id:'s3', kind:'stage', x:320, y:234, w:146, h:70, t:2, no:'03', nm:'界面设计', ar:'ui-spec.json',dim:true },

  { id:'s4', kind:'stage', x:534, y:150, w:156, h:86, t:3, no:'04', nm:'并行构建', ar:'modules/*.json',
    pill:'运行中', run:true,
    detail:{ k:'第 04 阶段 · 并行构建', v:'运行中 · 8.2 秒',
      p:'直通模式：跳过前三道工序，直接进入生成。',
      list:[['ok','完整 HTML 结构'],['ok','内联样式 / 脚本'],['ok','完全自包含'],['ok','数据能持久化']] } },

  { id:'s5', kind:'stage', x:762, y:92,  w:150, h:70, t:4, no:'05', nm:'集成装配', ar:'manifest.json', pill:'待执行', dim:true },

  { id:'s6', kind:'stage', x:762, y:232, w:150, h:70, t:5, no:'06', nm:'验收与交付', ar:'verdict.json', pill:'待执行', dim:true },

  { id:'art',  kind:'mini', x:534, y:20,  w:156, h:56, t:3, nm:'产物', sub:'单文件 · 零依赖', big:'23.3 KB',
    detail:{ k:'产物', v:'23.3 KB 单文件 HTML', p:'已落盘并登记 sha256。可以直接下载或在新标签打开。' } },

  { id:'chk', kind:'mini', x:534, y:286, w:156, h:56, t:5, nm:'成品自检', sub:'七项全过', big:'7 / 7',
    detail:{ k:'成品自检', v:'7 / 7 通过', p:'生成完成后自动跑的一组硬性检查。',
      list:[['ok','完整 HTML 结构'],['ok','内联样式'],['ok','内联脚本'],['ok','完全自包含'],
            ['ok','有事件处理'],['ok','数据能持久化'],['ok','中文界面']] } },

  /* 花费紧跟在自检下面 —— 它和产物、自检同属「这次跑出来的东西」，
     放在最右边会拉出一条很长的线，读起来像另一条流程 */
  { id:'cost', kind:'mini', x:534, y:360, w:156, h:56, t:0, nm:'本次花费', sub:'1 次模型调用', big:'¥0.0256',
    detail:{ k:'本次花费', v:'¥0.0256', p:'输入 198 · 输出 6 345 · 思考 0 · 缓存命中 0。已计入 cost_records 表。' } },
];

/* 连边。kind 决定线型：
     solid 普通流转 · live 正在流转 · back 回退（失败退回） */
const EDGES = [
  { f:'in',  t:'s1', k:'solid' },
  { f:'in',  t:'s2', k:'solid' },
  { f:'in',  t:'s3', k:'solid' },
  { f:'s1',  t:'s4', k:'solid' },
  { f:'s2',  t:'s4', k:'solid' },
  { f:'s3',  t:'s4', k:'solid' },
  { f:'s4',  t:'art',  k:'live' },
  { f:'s4',  t:'chk',  k:'live' },
  { f:'s4',  t:'cost', k:'live' },
  { f:'s4',  t:'s5', k:'solid' },
  { f:'s5',  t:'s6', k:'solid' },
  /* ★ 回退边 —— 来自 stages.ts 里真实声明的 fallbackTo。
     这是别的工具画不出来的东西：他们的流程没定义失败退回哪里。 */
  { f:'s3',  t:'s2', k:'back', label:'失败退回' },
  { f:'s6',  t:'s4', k:'back', label:'验收不过' },
];

/* ════════════════════════════════════════════════════════════
   渲染节点
   ════════════════════════════════════════════════════════════ */
const world = document.getElementById('world');
const edgesSvg = document.getElementById('edges');
const byId = {};
let selected = null;

for (const n of NODES) {
  byId[n.id] = n;
  const el = document.createElement('div');
  el.className = 'node' + (n.kind === 'stage' ? '' : ' mini') +
                 (n.kind === 'input' ? ' input' : '') +
                 (n.dim ? ' dim' : '') + (n.run ? ' run' : '');
  el.style.left = n.x + 'px';
  el.style.top = n.y + 'px';
  el.style.width = n.w + 'px';
  el.style.minHeight = n.h + 'px';
  if (n.t !== undefined) el.style.setProperty('--t', `var(${T[n.t]})`);

  if (n.kind === 'input') {
    el.innerHTML = `<div class="no"><i></i>输入</div><div class="tx">${n.tx}</div>`;
  } else if (n.kind === 'mini') {
    el.innerHTML = `<div class="nm">${n.nm}</div><div class="sub">${n.sub}</div><div class="big">${n.big}</div>`;
  } else {
    el.innerHTML =
      (n.pill ? `<span class="pill">${n.pill}</span>` : '') +
      `<div class="no"><i></i>${n.no}</div><div class="nm">${n.nm}</div><div class="ar">${n.ar}</div>`;
  }

  el.addEventListener('pointerdown', (e) => e.stopPropagation());
  el.addEventListener('click', () => selectNode(n.id));
  world.appendChild(el);
  n.el = el;
}

/* ════════════════════════════════════════════════════════════
   画连线
   ------------------------------------------------------------
   用三次贝塞尔。起点在源节点右边中点，终点在目标节点左边中点。
   回退边从下方绕，避免和主流程线重叠。
   ════════════════════════════════════════════════════════════ */
function drawEdges() {
  let html = '';
  for (const e of EDGES) {
    const a = byId[e.f], b = byId[e.t];
    if (!a || !b) continue;
    const ah = a.h || 70, bh = b.h || 70;

    /* 路由分三种情况。凭「源在左、目标在右」一条规则画所有线是错的：
       两个节点上下排列时，那条规则会让线往回绕。
       第一版就是这么错的，⑤→⑥ 那条线整个反了过来。 */
    const overlapsX = !(b.x >= a.x + a.w || b.x + b.w <= a.x);

    let x1, y1, x2, y2, d, tx, ty;

    if (e.k === 'back') {
      // 回退边：从下方绕，避开主流程
      x1 = a.x + a.w / 2; y1 = a.y + ah;
      x2 = b.x + b.w / 2; y2 = b.y + bh;
      const dip = Math.max(y1, y2) + 52;
      d = `M${x1},${y1} C${x1},${dip} ${x2},${dip} ${x2},${y2}`;
      tx = (x1 + x2) / 2; ty = dip - 5;
    } else if (overlapsX && b.y > a.y) {
      // 上下相邻：底 → 顶
      x1 = a.x + a.w / 2; y1 = a.y + ah;
      x2 = b.x + b.w / 2; y2 = b.y;
      d = `M${x1},${y1} C${x1},${y1 + 28} ${x2},${y2 - 28} ${x2},${y2}`;
      tx = (x1 + x2) / 2; ty = (y1 + y2) / 2;
    } else {
      // 左右相邻：右 → 左
      x1 = a.x + a.w; y1 = a.y + ah / 2;
      x2 = b.x;       y2 = b.y + bh / 2;
      const mx = (x1 + x2) / 2;
      d = `M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}`;
      tx = mx; ty = (y1 + y2) / 2 - 5;
    }

    html += `<path class="${e.k}" d="${d}"/>`;
    if (e.label) html += `<text x="${tx}" y="${ty}" text-anchor="middle">${e.label}</text>`;
  }
  edgesSvg.innerHTML = html;
}
drawEdges();

/* ════════════════════════════════════════════════════════════
   点选 → 右侧详情
   ════════════════════════════════════════════════════════════ */
const ptitle = document.getElementById('ptitle');
const pbody  = document.getElementById('pbody');

function esc(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

function selectNode(id) {
  const n = byId[id];
  if (!n) return;
  selected = id;
  for (const k in byId) byId[k].el.classList.toggle('sel', k === id);

  ptitle.textContent = n.nm || '输入';
  const d = n.detail;
  if (!d) {
    // 未接入的工序：如实说明，不假装有产物
    pbody.innerHTML = `
      <div class="card">
        <div class="k">第 ${n.no} 阶段 · ${n.nm}</div>
        <div class="v" style="color:var(--ink-4)">未接入</div>
        <p>这一道工序当前不产出契约文件（<code>${esc(n.ar)}</code>），
           正在接入中。现在由直通模式直接跳到构建。</p>
      </div>
      <p class="muted">界面上如实标注「未接入」，而不是标成「已通过」——
        因为标成已通过却交不出产物，比直接说没做更糟。</p>`;
    return;
  }

  let html = `<div class="card"><div class="k">${esc(d.k)}</div>
              <div class="v">${esc(d.v)}</div>`;
  if (d.p) html += `<p>${esc(d.p)}</p>`;
  if (d.list) {
    html += '<ul>' + d.list.map(([c, t]) => `<li class="${c}">${esc(t)}</li>`).join('') + '</ul>';
  }
  html += '</div>';
  if (id === 's4' || id === 's5' || id === 's6') {
    html += `<p class="muted">这一阶段的花费、耗时与产物都会记进数据库，
             可以在时间轴上回放。</p>`;
  }
  pbody.innerHTML = html;
}

/* ════════════════════════════════════════════════════════════
   平移 / 缩放
   ------------------------------------------------------------
   只改一个 transform —— 平移缩放过程中不重排任何节点。
   这条和项目里「只动 transform / opacity」的规矩一致。
   ════════════════════════════════════════════════════════════ */
const vp = document.getElementById('vp');
const zl = document.getElementById('zl');

let scale = 1, tx = 40, ty = 20;
let panning = false, sx = 0, sy = 0, stx = 0, sty = 0;

function apply() {
  // 四舍五入到 0.01px，避免子像素抖动造成文字模糊
  world.style.transform =
    `translate(${Math.round(tx * 100) / 100}px, ${Math.round(ty * 100) / 100}px) scale(${scale})`;
  zl.textContent = Math.round(scale * 100) + '%';
}

/** 以某个屏幕坐标为中心缩放 —— 不这么做的话，滚轮缩放会「跑偏」 */
function zoomAt(cx, cy, factor) {
  const next = Math.min(2.2, Math.max(0.28, scale * factor));
  const k = next / scale;
  tx = cx - (cx - tx) * k;
  ty = cy - (cy - ty) * k;
  scale = next;
  apply();
}

function fitView() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const n of NODES) {
    minX = Math.min(minX, n.x); minY = Math.min(minY, n.y);
    maxX = Math.max(maxX, n.x + n.w); maxY = Math.max(maxY, n.y + (n.h || 70));
  }
  const pad = 60;
  const vw = vp.clientWidth, vh = vp.clientHeight;
  const s = Math.min((vw - pad * 2) / (maxX - minX), (vh - pad * 2) / (maxY - minY), 1.25);
  scale = s;
  tx = (vw - (maxX - minX) * s) / 2 - minX * s;
  ty = (vh - (maxY - minY) * s) / 2 - minY * s;
  apply();
}

function reset() { scale = 1; tx = 40; ty = 20; apply(); }

vp.addEventListener('pointerdown', (e) => {
  panning = true; sx = e.clientX; sy = e.clientY; stx = tx; sty = ty;
  vp.classList.add('grabbing');
  vp.setPointerCapture(e.pointerId);
});
vp.addEventListener('pointermove', (e) => {
  if (!panning) return;
  tx = stx + (e.clientX - sx);
  ty = sty + (e.clientY - sy);
  apply();
});
vp.addEventListener('pointerup', (e) => {
  panning = false; vp.classList.remove('grabbing');
  try { vp.releasePointerCapture(e.pointerId); } catch {}
});
/* passive:false 是必须的 —— 否则 preventDefault 无效，滚轮会带着页面一起滚 */
vp.addEventListener('wheel', (e) => {
  e.preventDefault();
  const r = vp.getBoundingClientRect();
  zoomAt(e.clientX - r.left, e.clientY - r.top, e.deltaY < 0 ? 1.1 : 1 / 1.1);
}, { passive: false });

document.getElementById('zi').onclick = () => zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, 1.2);
document.getElementById('zo').onclick = () => zoomAt(vp.clientWidth / 2, vp.clientHeight / 2, 1 / 1.2);
document.getElementById('zfit').onclick = fitView;
document.getElementById('zreset').onclick = reset;

window.addEventListener('keydown', (e) => {
  if (e.key === '0') fitView();
  if (e.key === '1') reset();
});

/* 首屏：先摆好再适应窗口，避免看到跳动 */
apply();
fitView();
</script>
</body>
</html>
